name: Deploy marimo to GitHub Pages

on:
  push:
    branches: [ main ] # Change to your default branch if it's not main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2 # Updated version

      - name: Set up Python
        uses: actions/setup-python@v5.4.0 # Updated version
        with:
          python-version: '3.11'

      - name: Install marimo and uv
        run: pip install marimo uv

      # Replace 'notebook.py' with the actual filename of your marimo notebook
      - name: Export notebook to WASM HTML
        run: |
          mkdir -p dist
          marimo export html-wasm contingency_notebook.py --output dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
